name: Hockey tickets monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"


# Empêche 2 exécutions simultanées (évite les conflits git sur state.json)
concurrency:
  group: hockey-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0  # important pour pouvoir pull --rebase proprement

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_digitick.py

      - name: Commit state.json (if changed)
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add state.json

            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi

            # On commit, puis on essaie de se rebaser sur le remote (au cas où)
            git commit -m "Update state.json" || true

            # On tente de récupérer les changements distants puis push.
            # IMPORTANT: ne jamais faire échouer le workflow à cause d’un conflit de push.
            git pull --rebase origin main || true
            git push origin main || true
          else
            echo "state.json not found, nothing to commit."
          fi
